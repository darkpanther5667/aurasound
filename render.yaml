services:
  # -------------------------------------------------------------
  # 1. Private Extraction Microservice (YouTube Audio Worker)
  # -------------------------------------------------------------
  - type: pserv
    name: aurasound-extraction
    env: node
    plan: starter
    region: singapore
    rootDir: extraction
    buildCommand: npm install && npm run build
    startCommand: node dist/index.js
    envVars:
      - key: PORT
        value: 4001
      - key: HOST
        value: 0.0.0.0
      - key: NODE_ENV
        value: production

  # -------------------------------------------------------------
  # 2. Public Backend API Gateway
  # -------------------------------------------------------------
  - type: web
    name: aurasound-backend
    env: node
    plan: starter
    region: singapore
    rootDir: backend
    buildCommand: npm install && npm run build && npx prisma db push
    startCommand: node dist/index.js
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: aurasound-db
          property: connectionString
      - key: EXTRACTION_SERVICE_URL
        value: http://aurasound-extraction:4001
      - key: CORS_ORIGIN
        value: "*"
      - key: JWT_SECRET
        generateValue: true

databases:
  # -------------------------------------------------------------
  # 3. Managed PostgreSQL Database
  # -------------------------------------------------------------
  - name: aurasound-db
    plan: free
    region: singapore
    databaseName: aurasound
    user: aurasound_user
